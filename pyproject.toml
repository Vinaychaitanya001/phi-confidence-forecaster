[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deidconf"
version = "0.1.0"
description = "Confidence-aware clinical de-identification on the MedDeID English synthetic corpus"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.6",
  "transformers>=4.45,<5",
  "tokenizers>=0.20",
  "safetensors>=0.4",
  "huggingface_hub>=0.34,<1.0",
  "numpy>=1.26",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.5",
  "joblib>=1.3",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["deidconf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
